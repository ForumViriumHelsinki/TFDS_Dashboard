apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfds-dashboard
  namespace: tfds-dashboard
  labels:
    app: tfds-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tfds-dashboard
  template:
    metadata:
      labels:
        app: tfds-dashboard
    spec:
      containers:
        - name: tfds-dashboard
          image: tfds-dashboard
          ports:
            - containerPort: 80
          env:
            # InfluxDB proxy configuration for local development
            # In production, these come from Kubernetes Secrets via ArgoCD
            # For local dev, use external HTTPS endpoint (different from prod internal HTTP)
            - name: INFLUXDB_URL
              value: "https://idea-helsinki-influxdb-helm-webapp.dataportal.fi"
            - name: INFLUXDB_HOST
              value: "idea-helsinki-influxdb-helm-webapp.dataportal.fi"
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tfds-dashboard-secrets
                  key: INFLUXDB_TOKEN
                  optional: true # Allow deployment without secret for initial setup
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
