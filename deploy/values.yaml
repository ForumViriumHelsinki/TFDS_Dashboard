image:
  repository: ghcr.io/forumviriumhelsinki/tfds-dashboard
  tag: "0.7.7"
imagePullSecrets:
- name: ghcr-login-secret
# Use shared service account with Workload Identity for GCS access
serviceAccount:
  create: false
  name: idea-helsinki-shared
# GCS-FUSE sidecar configuration
podAnnotations:
  gke-gcsfuse/volumes: "true"
  gke-gcsfuse/cpu-limit: "250m"
  gke-gcsfuse/memory-limit: "256Mi"
  gke-gcsfuse/ephemeral-storage-limit: "1Gi"
# Envoy Gateway configuration (Gateway API)
gateway:
  enabled: true
  hosts:
  - host: dashboard.helsinki.trafficflowdataspace.eu
    paths:
    - path: /
      pathType: PathPrefix
env:
  SENTRY_DSN:
    valueFrom:
      secretKeyRef:
        name: tfds-dashboard-secrets
        key: SENTRY_DSN
  # NGINX proxy configuration for InfluxDB
  # These are substituted by envsubst at container startup, creating static proxy config
  # Use http:// for internal K8s services (HTTPS is terminated at the gateway)
  INFLUXDB_URL:
    value: "http://idea-helsinki-influxdb-helm-webapp.idea-helsinki.svc.cluster.local:8086"
  INFLUXDB_HOST:
    value: "idea-helsinki-influxdb-helm-webapp.idea-helsinki.svc.cluster.local:8086"
  INFLUXDB_TOKEN:
    valueFrom:
      secretKeyRef:
        name: tfds-dashboard-secrets
        key: INFLUX_DB_TFDS_TOKEN
  # GO Feature Flag relay proxy configuration
  GOFF_URL:
    value: "http://gofeatureflag-relay-proxy.feature-flags.svc.cluster.local:1031"
  GOFF_HOST:
    value: "gofeatureflag-relay-proxy.feature-flags.svc.cluster.local"
  # Legacy variables - keeping for backwards compatibility during transition
  # These can be removed once we verify the proxy approach works
  INFLUX_DB_URL:
    valueFrom:
      secretKeyRef:
        name: tfds-dashboard-secrets
        key: INFLUX_DB_URL
  INFLUX_DB_ORG:
    valueFrom:
      secretKeyRef:
        name: tfds-dashboard-secrets
        key: INFLUX_DB_ORG
  INFLUX_DB_FCD_BUCKET:
    valueFrom:
      secretKeyRef:
        name: tfds-dashboard-secrets
        key: INFLUX_DB_FCD_BUCKET
  INFLUX_DB_VALIDATION_BUCKET:
    valueFrom:
      secretKeyRef:
        name: tfds-dashboard-secrets
        key: INFLUX_DB_VALIDATION_BUCKET
  INFLUX_DB_TFDS_TOKEN:
    valueFrom:
      secretKeyRef:
        name: tfds-dashboard-secrets
        key: INFLUX_DB_TFDS_TOKEN
replicaCount: 1
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 101 # nginx user
  capabilities:
    drop:
    - ALL
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
# Volumes for writable directories (required with readOnlyRootFilesystem)
volumes:
- name: nginx-cache
  emptyDir: {}
- name: nginx-run
  emptyDir: {}
- name: nginx-tmp
  emptyDir: {}
- name: nginx-conf
  emptyDir: {}
# GCS-FUSE volume for shared data (idea-helsinki bucket)
- name: shared-data
  persistentVolumeClaim:
    claimName: idea-helsinki-shared-pvc
volumeMounts:
- name: nginx-cache
  mountPath: /var/cache/nginx
- name: nginx-run
  mountPath: /var/run
- name: nginx-tmp
  mountPath: /tmp
- name: nginx-conf
  mountPath: /etc/nginx/conf.d
# Mount GCS bucket path idea-helsinki/data to public/data
- name: shared-data
  mountPath: /usr/share/nginx/html/public/data
  subPath: data
  readOnly: true
keda:
  enabled: true
  minReplicaCount: 0
  maxReplicaCount: 2
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
  - type: cron
    metadata:
      timezone: Europe/Helsinki
      start: 0 7 * * 1-5
      end: 0 22 * * 1-5
      desiredReplicas: "1"
